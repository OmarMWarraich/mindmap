name: security

# Static application security testing (see docs/ISSUE_NO_16.md).
# Layers: type/lint/test baseline, CodeQL, Semgrep, secret scanning, and a
# dependency-audit gate. CodeQL and Semgrep publish SARIF to the Security tab.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so newly disclosed CVEs in unchanged code are still caught.
    - cron: '0 6 * * 1'

# Read-only by default; jobs that upload SARIF opt into security-events: write.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # JavaScript/TypeScript needs no build step for CodeQL (no autobuild).
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Repo-invariant rules are the blocking gate: they are verified clean
      # locally, so any hit is a genuine regression.
      - name: Semgrep custom rules (blocking)
        run: semgrep scan --config .semgrep/rules.yml --error --experimental
      # Broad registry rulesets are report-only (SARIF -> Security tab) so a
      # pre-existing finding in a community rule never blocks every PR. Tighten
      # to blocking once the backlog is triaged (see docs/ISSUE_NO_16.md).
      - name: Semgrep registry rulesets (report-only)
        if: always()
        run: >
          semgrep scan
          --config p/typescript
          --config p/react
          --config p/nextjs
          --config p/owasp-top-ten
          --config p/secrets
          --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          sarif_file: semgrep.sarif

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so a secret in an earlier commit is still caught.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocks on high/critical advisories. Dependabot (.github/dependabot.yml)
      # opens the fix PRs; this is the merge-time gate.
      - run: npm audit --omit=dev --audit-level=high

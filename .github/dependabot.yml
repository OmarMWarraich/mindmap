version: 2
# Weekly dependency-update PRs (docs/ISSUE_NO_16.md). Complements the
# npm-audit gate in .github/workflows/security.yml and GitHub's Dependabot
# security alerts.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch routine minor/patch bumps into one PR to cut review churn;
      # majors still open individually.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
